name: Close tickets

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi
            const before = context.payload.before
            let messages = []
            if (!before || /^0+$/.test(before)) {
              messages = (context.payload.commits ?? []).map((commit) => commit.message ?? "")
            } else {
              const compared = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${before}...${context.sha}`,
                per_page: 100,
              })
              messages = compared.data.commits.map((commit) => commit.commit.message ?? "")
            }

            const issueNumbers = new Set()
            for (const message of messages) {
              for (const match of message.matchAll(keyword)) {
                issueNumbers.add(Number(match[1]))
              }
            }

            for (const issue_number of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                })
                if (issue.data.pull_request || issue.data.state !== "open") {
                  continue
                }
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  state: "closed",
                  state_reason: "completed",
                })
                core.info(`Closed #${issue_number}`)
              } catch (error) {
                core.warning(`Could not close #${issue_number}: ${error.message}`)
              }
            }
